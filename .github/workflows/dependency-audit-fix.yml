name: Fix dependency vulnerabilities

on:
  pull_request:
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply Bun security fixes
        run: bun audit fix
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dependency-audit-fix.yml
          git add package.json bun.lock .github/workflows/dependency-audit-fix.yml
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "fix: apply dependency security updates"
          git push origin HEAD:fix/security-dependencies
