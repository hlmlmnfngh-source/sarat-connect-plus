name: Refresh dependency lockfile

on:
  push:
    branches:
      - fix/security-dependencies

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update dependencies
        run: bun update

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dependency-refresh.yml
          git add bun.lock .github/workflows/dependency-refresh.yml
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:fix/security-dependencies
