name: Refresh vulnerable transitive dependencies

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Update vulnerable transitive packages
        run: |
          bun update baseline-browser-mapping brace-expansion browserslist fast-uri hono ip-address js-yaml nanoid postcss-selector-parser qs --lockfile-only
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dependency-transitive-fix.yml
          git add package.json bun.lock .github/workflows/dependency-transitive-fix.yml
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "fix: refresh vulnerable transitive dependencies"
          git push origin HEAD:fix/security-dependencies
